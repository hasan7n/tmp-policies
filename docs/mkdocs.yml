site_name: Policy Fabric
site_description: Policy Fabric — decoupled AI governance reference implementation
docs_dir: docs

nav:
  - Policy Fabric 101: index.md
  - Hands-On Tutorial: tutorial.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - toc.integrate
    - content.code.copy

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition
