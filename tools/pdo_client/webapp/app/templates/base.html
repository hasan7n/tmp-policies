<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}PDO Client{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

<nav class="navbar">
    <a href="/" class="nav-brand">PDO Client</a>

    <div class="nav-links">
        <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Assets</a>
        <a href="/wallets/" {% if '/wallets/' in request.path %}class="active"{% endif %}>Wallets</a>
    </div>

    <div class="nav-right">
        <form method="post" action="{% url 'identity_set' %}" class="nav-identity">
            {% csrf_token %}
            <label class="nav-identity-label" for="nav-identity-select">Identity:</label>
            <select id="nav-identity-select" name="public_key" class="nav-identity-select"
                    onchange="this.form.submit()">
                {% if not current_identity %}
                <option value="" selected disabled>Select…</option>
                {% endif %}
                {% if current_identity and current_identity not in available_identities %}
                <option value="{{ current_identity }}" selected>{{ current_identity }}</option>
                {% endif %}
                {% for name in available_identities %}
                <option value="{{ name }}" {% if name == current_identity %}selected{% endif %}>{{ name }}</option>
                {% endfor %}
            </select>
        </form>
        {% if current_identity %}
        {% if has_channel_key %}
        <button type="button" class="nav-identity-btn"
                data-modal-open="channel-key-modal">View your channel key</button>
        {% else %}
        <button type="button" class="nav-identity-btn"
                id="generate-channel-key-btn">Generate a channel_key</button>
        {% endif %}
        {% endif %}
        <a href="/config/" class="nav-settings-link" title="Settings">&#9881;</a>
    </div>
</nav>

<!-- View Channel Key Modal: shows only the public channel key. -->
<div id="channel-key-modal" class="modal-backdrop hidden">
    <div class="modal" style="max-width:640px">
        <div class="modal-header">
            <span class="modal-title">Your Channel Key</span>
            <button type="button" class="modal-close"
                    data-modal-close="channel-key-modal">&times;</button>
        </div>
        <pre class="code-block" style="white-space:pre-wrap">{{ channel_public_key_escaped }}</pre>
        <div class="form-actions">
            <button type="button" class="btn btn-primary"
                    data-copy="{{ channel_public_key_escaped }}">Copy</button>
        </div>
    </div>
</div>

{% block content %}{% endblock %}

<script src="/static/js/client.js"></script>
<script src="/static/js/modals.js"></script>
<script src="/static/js/flash.js"></script>
<script src="/static/js/copy.js"></script>
<script src="/static/js/channel_key.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
