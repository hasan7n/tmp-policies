{% extends "base.html" %}
{% block title %}Register Asset — PDO Client{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <div>
            <h1 class="page-title">Register Asset</h1>
        </div>
        <a href="/" class="btn">Cancel</a>
    </div>

    <div class="card card-narrow">
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_name">Name</label>
                <input type="text" id="id_name" name="name"
                       value="{{ form.name|default:'' }}"
                       placeholder="e.g. genomics_dataset_1" required>
            </div>

            <div class="form-group">
                <label for="id_data_source">Data Path</label>
                <input type="text" id="id_data_source" name="data_source"
                       value="{{ form.data_source|default:'' }}"
                       placeholder="/path/to/data/file.txt" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Register Asset</button>
                <a href="/" class="btn">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
